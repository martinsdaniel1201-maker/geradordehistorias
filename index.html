<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0F1226">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon.svg">
<title>Lua de Histórias</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Literata:opsz,wght@7..72,400;7..72,500&display=swap" rel="stylesheet">
<style>
:root{--noite:#0F1226;--ceu:#1A1F3D;--borda:#2E3566;--lua:#F2D98D;--texto:#E6E4F2;--suave:#9EA2C8;--leitura:#070918;--leitura-txt:#D8D2BF;
--titulo:"Fraunces",Georgia,serif;--corpo:"Literata",Georgia,serif}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;background:var(--noite);color:var(--texto);font-family:var(--corpo);font-size:17px;line-height:1.5;min-height:100dvh;
padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom);transition:background .6s}
body.dark{background:var(--leitura)}
main{max-width:560px;margin:0 auto;padding:28px 22px 40px}
h1,h2{font-family:var(--titulo);font-weight:700;line-height:1.15;margin:0}
h1{font-size:34px;margin-top:14px}
header p{color:var(--suave);margin:8px 0 0}
section{margin-top:30px}
.lb{display:block;font-weight:500;margin-bottom:10px}
input[type=text],input[type=number]{width:100%;background:var(--ceu);border:1px solid var(--borda);color:var(--texto);border-radius:12px;padding:13px 14px;font:inherit}
.row{display:grid;grid-template-columns:1fr 84px;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{font:inherit;color:var(--texto);background:transparent;border:1px solid var(--borda);border-radius:999px;padding:10px 16px;min-height:44px}
.chip[aria-pressed=true]{background:var(--lua);border-color:var(--lua);color:#1B1A12;font-weight:500}
.cta{width:100%;margin-top:34px;background:var(--lua);color:#1B1A12;border:0;border-radius:18px;padding:18px;font:700 20px var(--titulo)}
.alt{width:100%;margin-top:12px;background:transparent;color:var(--lua);border:1px solid var(--lua);border-radius:18px;padding:16px;font:700 18px var(--titulo)}
.lnk{background:none;border:0;color:var(--lua);font:inherit;padding:10px 0;margin-top:6px;text-decoration:underline;text-underline-offset:4px}
.chk{display:flex;gap:10px;align-items:center;margin-top:22px;color:var(--suave)}
.chk input{width:22px;height:22px;accent-color:var(--lua)}
button:focus-visible,input:focus-visible{outline:3px solid var(--lua);outline-offset:2px}
.rd{max-width:620px;margin:0 auto;padding:44px 26px 150px;color:var(--leitura-txt)}
.rd h2{font-size:calc(var(--fs) * 1.35);margin-bottom:28px;color:var(--lua)}
.rd p{font-size:var(--fs);line-height:1.75;margin:0 0 1.1em}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;justify-content:center;padding:12px 14px calc(12px + env(safe-area-inset-bottom));
background:linear-gradient(transparent,var(--leitura) 40%)}
.bar button{font:inherit;color:var(--leitura-txt);background:#12152B;border:1px solid var(--borda);border-radius:14px;padding:12px 16px;min-height:48px}
.bar button[aria-pressed=true]{color:var(--lua);border-color:var(--lua)}
.msg{min-height:80dvh;display:grid;place-content:center;text-align:center;padding:24px;gap:14px}
.msg h2{font-size:26px}.msg p{color:var(--suave);margin:0}
.lua{width:64px;height:64px;margin:0 auto;border-radius:50%;box-shadow:inset -18px 0 0 0 var(--lua);animation:bal 3s ease-in-out infinite}
@keyframes bal{50%{transform:translateY(-8px)}}
.item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0;border-bottom:1px solid var(--borda)}
.item button.t{flex:1;text-align:left;background:none;border:0;color:var(--texto);font:700 19px var(--titulo);padding:0}
.item button.d{background:none;border:0;color:var(--suave);font:inherit;padding:10px}
@media (prefers-reduced-motion:reduce){.lua{animation:none}body{transition:none}}
</style>
</head>
<body>
<div id="app"></div>
<script>
// ====== CONFIGURE AQUI ======
const API = "https://pmgemcvsobonypojltpw.supabase.co/functions/v1/gerar-historia";
const ANON = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBtZ2VtY3Zzb2Jvbnlwb2psdHB3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODEwNjE1MTcsImV4cCI6MjA5NjYzNzUxN30.3SBG5Lm3A039MprUG4Ea_WVs29iAMtODBE6s3KpoRLg";
// ============================
const TEMAS = ["Animais da floresta","Viagem pelo espaço","Fazenda","Fundo do mar","Dinossauros","Super-heróis","Tratores e máquinas","Castelo e dragão amigo"];
const LICOES = ["Coragem","Gratidão","Dividir com os outros","Amizade","Não ter medo do escuro","Paciência"];
const MIN = [3,5,8];
const TIPOS = ["Original","Clássicos","Bíblia"];
const CLASSICOS = ["Chapeuzinho Vermelho","Os Três Porquinhos","Cachinhos Dourados","O Patinho Feio","João e o Pé de Feijão","Cinderela","A Branca de Neve","A Bela Adormecida","O Gato de Botas","A Lebre e a Tartaruga","A Cigarra e a Formiga","O Pequeno Polegar","Rapunzel","Pinóquio","A Pequena Sereia","Os Músicos de Bremen"];
const BIBLIA = ["A criação do mundo","Noé e a arca","José e a túnica colorida","Moisés e o mar Vermelho","Davi e Golias","Daniel na cova dos leões","Jonas e o grande peixe","O nascimento de Jesus","Jesus e as crianças","A ovelha perdida","O bom samaritano","Zaqueu no sicômoro","Jesus acalma a tempestade","A multiplicação dos pães"];
const S = Object.assign({nome:"Ravi",idade:5,tema:TEMAS[0],licao:LICOES[0],min:5,amigo:"",cont:false,tipo:"Original",classico:"Chapeuzinho Vermelho",biblia:"Noé e a arca",outra:"",contadas:{},favs:[],ult:null,fs:24,pin:""},
  JSON.parse(localStorage.getItem("lua")||"{}"));
const save = () => localStorage.setItem("lua", JSON.stringify(S));
const app = document.getElementById("app");
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const chips = (arr,k) => arr.map(v => `<button class="chip" data-k="${k}" data-v="${v}" aria-pressed="${S[k]==v}">${v}${k==="min"?" min":""}</button>`).join("");
let cur = null;

function home(){
  document.body.classList.remove("dark");
  const o = S.tipo==="Original", cl = S.tipo==="Clássicos", lista = cl?CLASSICOS:BIBLIA, k = cl?"classico":"biblia";
  app.innerHTML = `<main>
  <header><h1>Boa noite, ${esc(S.nome)}</h1><p>Que história vamos contar hoje?</p>
  <button class="lnk" data-a="lib">Histórias salvas (${S.favs.length})</button></header>
  <section><span class="lb">Tipo de história</span><div class="chips">${chips(TIPOS,"tipo")}</div></section>
  <section><label class="lb" for="idade">${o?"Herói e idade":"Idade da criança"}</label>
    <div class="row" ${o?"":'style="grid-template-columns:84px"'}>${o?`<input id="nome" type="text" value="${esc(S.nome)}" autocomplete="off">`:""}
    <input id="idade" type="number" min="2" max="12" value="${S.idade}" aria-label="Idade"></div></section>
  ${o?`<section><span class="lb">Tema</span><div class="chips">${chips(TEMAS,"tema")}</div></section>
  <section><span class="lb">Lição suave</span><div class="chips">${chips(LICOES,"licao")}</div></section>`
  :`<section><span class="lb">Escolha a história</span><div class="chips">${chips(lista,k)}</div></section>
  <section><label class="lb" for="outra">Ou digite outra (tem prioridade)</label>
    <input id="outra" type="text" placeholder="${cl?"ex.: Rapunzel":"ex.: A arca da aliança"}" value="${esc(S.outra)}" autocomplete="off"></section>`}
  <section><span class="lb">Duração</span><div class="chips">${chips(MIN,"min")}</div></section>
  ${o?`<section><label class="lb" for="amigo">Um amigo na história (opcional)</label>
    <input id="amigo" type="text" placeholder="ex.: coelhinho Totó" value="${esc(S.amigo)}" autocomplete="off"></section>
  ${S.ult?`<label class="chk"><input type="checkbox" id="cont" ${S.cont?"checked":""}>Continuar a última história</label>`:""}`:""}
  <button class="cta" data-a="gen">${o?"Contar uma história":"Contar a história escolhida"}</button>${o?"":`<button class="alt" data-a="rand">Surpreenda-me</button>`}</main>`;
}

function reader(h){
  cur = h; const fav = S.favs.some(f => f.id === h.id);
  document.body.classList.add("dark");
  app.innerHTML = `<article class="rd" style="--fs:${S.fs}px"><h2>${esc(h.titulo)}</h2>${h.texto.split(/\n+/).map(p=>`<p>${esc(p)}</p>`).join("")}</article>
  <nav class="bar"><button data-a="home">Voltar</button><button data-a="fm" aria-label="Diminuir letra">A−</button><button data-a="fp" aria-label="Aumentar letra">A+</button>
  <button data-a="fav" aria-pressed="${fav}">${fav?"Salva":"Salvar"}</button></nav>`;
  scrollTo(0,0);
  try{ navigator.wakeLock && navigator.wakeLock.request("screen"); }catch(e){}
}

function lib(){
  document.body.classList.remove("dark");
  app.innerHTML = `<main><header><h1>Histórias salvas</h1><button class="lnk" data-a="home">Voltar</button></header>
  <section>${S.favs.length ? S.favs.map((f,i)=>`<div class="item"><button class="t" data-a="open" data-i="${i}">${esc(f.titulo)}</button><button class="d" data-a="del" data-i="${i}">Remover</button></div>`).join("")
  : `<p style="color:var(--suave)">Nenhuma ainda. Toque em Salvar numa história de que o ${esc(S.nome)} gostar.</p>`}</section></main>`;
}

function msg(t,p,btn){
  document.body.classList.add("dark");
  app.innerHTML = `<div class="msg">${btn?"":'<div class="lua"></div>'}<h2>${t}</h2><p>${p}</p>${btn?'<button class="cta" data-a="gen">Tentar de novo</button><button class="lnk" data-a="home">Voltar</button>':""}</div>`;
}

function surpresa(){
  const cl = S.tipo==="Clássicos", lista = cl?CLASSICOS:BIBLIA, k = cl?"classico":"biblia";
  const ja = S.contadas[S.tipo]||[]; let pool = lista.filter(x=>!ja.includes(x));
  if(!pool.length){ S.contadas[S.tipo]=[]; pool = lista; }
  S[k] = pool[Math.floor(Math.random()*pool.length)]; S.outra = ""; save(); gerar();
}

async function gerar(){
  if(!S.pin){ S.pin = prompt("Código de acesso do app:") || ""; save(); }
  msg("Preparando a história…","Respire fundo. Já já começa.");
  try{
    const r = await fetch(API,{method:"POST",
      headers:{"Content-Type":"application/json",apikey:ANON,Authorization:"Bearer "+ANON,"x-app-pin":S.pin},
      body:JSON.stringify({tipo:S.tipo,historia:S.outra.trim()||(S.tipo==="Clássicos"?S.classico:S.tipo==="Bíblia"?S.biblia:""),nome:S.nome,idade:S.idade,tema:S.tema,licao:S.licao,minutos:S.min,amigo:S.amigo,
        anterior:S.tipo==="Original"&&S.cont&&S.ult?S.ult.texto.slice(0,700):""})});
    const d = await r.json();
    if(!r.ok){ if(r.status===401){S.pin="";save();} throw new Error(d.erro||"Falha ao gerar"); }
    S.ult = {id:Date.now(),titulo:d.titulo,texto:d.texto};
    if(S.tipo!=="Original"){ const h=S.outra.trim()||(S.tipo==="Clássicos"?S.classico:S.biblia), c=S.contadas[S.tipo]=S.contadas[S.tipo]||[]; if(!c.includes(h)) c.push(h); }
    save(); reader(S.ult);
  }catch(e){ msg("Não deu certo",esc(e.message||"Verifique a internet e tente de novo."),true); }
}

app.addEventListener("click",e=>{
  const b = e.target.closest("button"); if(!b) return;
  if(b.dataset.k){ S[b.dataset.k] = b.dataset.k==="min" ? +b.dataset.v : b.dataset.v; save();
    if(b.dataset.k==="tipo"){ home(); return; }
    b.parentElement.querySelectorAll(".chip").forEach(c=>c.setAttribute("aria-pressed",c===b)); return; }
  const a = b.dataset.a, i = +b.dataset.i;
  if(a==="gen") gerar();
  else if(a==="rand") surpresa();
  else if(a==="home") home();
  else if(a==="lib") lib();
  else if(a==="open") reader(S.favs[i]);
  else if(a==="del"){ S.favs.splice(i,1); save(); lib(); }
  else if(a==="fm"||a==="fp"){ S.fs = Math.min(40,Math.max(18,S.fs+(a==="fp"?2:-2))); save(); document.querySelector(".rd").style.setProperty("--fs",S.fs+"px"); }
  else if(a==="fav"){ const k = S.favs.findIndex(f=>f.id===cur.id); k>=0 ? S.favs.splice(k,1) : S.favs.unshift(cur); save(); reader(cur); }
});
app.addEventListener("input",e=>{
  const t = e.target;
  if(t.id==="nome") S.nome = t.value.trim()||"Ravi";
  else if(t.id==="idade") S.idade = +t.value||5;
  else if(t.id==="amigo") S.amigo = t.value;
  else if(t.id==="outra") S.outra = t.value;
  else if(t.id==="cont") S.cont = t.checked;
  save();
});
home();
if("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
</body>
</html>
